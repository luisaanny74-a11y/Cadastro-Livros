{% extends "base.html" %}
{% block title %}Cadastrar livro{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">Novo registro</p><h1>Cadastrar livro</h1><p>Preencha os dados abaixo para incluir uma obra no acervo.</p></section>
{% if erro %}<div class="alert alert-error" role="alert">{{ erro }}</div>{% endif %}
<form class="book-form" action="{{ url_for('cadastrar_livro') }}" method="post">
<div class="form-group form-group-wide"><label for="titulo">Título</label><input type="text" id="titulo" name="titulo" value="{{ dados.titulo if dados else '' }}" required maxlength="120"></div>
<div class="form-group"><label for="autor">Autor</label><input type="text" id="autor" name="autor" value="{{ dados.autor if dados else '' }}" required maxlength="100"></div>
<div class="form-group"><label for="ano">Ano de publicação</label><input type="number" id="ano" name="ano" value="{{ dados.ano if dados else '' }}" min="1" max="2026" inputmode="numeric"></div>
<div class="form-group form-group-wide"><label for="categoria">Categoria</label><input type="text" id="categoria" name="categoria" value="{{ dados.categoria if dados else '' }}" maxlength="60" placeholder="Ex.: Romance, História, Fantasia"></div>
<div class="form-actions"><button class="button" type="submit">Salvar livro</button><a href="{{ url_for('listar_livros') }}">Cancelar</a></div>
</form>
{% endblock %}
